apis:
  - aid: lepton-ai:dgx-cloud-lepton
    name: NVIDIA DGX Cloud Lepton API
    description: >-
      Managed AI platform API exposing model endpoints (HTTP server with OpenAI-compatible
      chat surface), dev sessions with managed GPUs, distributed training jobs, and batch
      processing. Endpoints are deployed at unique URLs per workload via the Lepton
      dashboard at dashboard.dgxc-lepton.nvidia.com.
    image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    humanURL: https://docs.nvidia.com/dgx-cloud/lepton/get-started/
